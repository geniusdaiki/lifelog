<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-title" content="行動ログ">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>行動ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171C;--mute:#5B6270;--line:#E4E7EC;--soft:#EEF0F3;--bg:#F4F5F7;--acc:#0F766E;--acc2:#E6F4F1;--amber:#D97706;--amber2:#FDF1E3;--blue:#1D4ED8;--blue2:#E7F1FB;--ok:#0F766E;--gray:#9AA1AD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dark{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.dark .mute{color:rgba(255,255,255,.65)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:22px;font-weight:700}
h2{margin:0;font-size:15px;font-weight:700}
.mute{color:var(--mute);font-size:12px}
.tag{font-size:11px;font-weight:500;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.tag.ok{background:var(--acc2);color:var(--ok)}.tag.warn{background:var(--amber2);color:var(--amber)}.tag.blue{background:var(--blue2);color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.row b{font-weight:600;white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--mute)}
.hr{height:1px;background:var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .lab b{font-weight:700}
.ring .lab small{font-size:11px;color:var(--mute);margin-top:3px}
.ring circle.v{animation:ringfill 1.1s cubic-bezier(.2,.8,.2,1) both}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .d{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.cal .d.today{background:var(--acc);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.cal .d span{font-size:10px;opacity:.8}.cal .d b{font-size:15px}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.dot.ok{background:#34D399}.dot.warn{background:#FBBF24}.dot.now{background:#fff;animation:pulse 1.6s ease-in-out infinite}
.todo{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--soft);border-radius:12px;animation:slidein .5s ease-out both}
.todo .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);flex:0 0 auto}
.todo.warn .cb{border-color:var(--amber)}
.todo .t{flex:1;display:flex;flex-direction:column;gap:1px}.todo .t b{font-size:14px;font-weight:600}.todo .t span{font-size:12px;color:var(--mute)}
.todo .pt{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap}.todo.warn .pt{color:var(--amber)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.gcell small{font-size:11px;color:var(--mute);font-weight:400;margin-top:-4px;text-align:center}
.vb{display:flex;gap:4px;align-items:flex-end}
.vb .c{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.vb .c i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 2px 2px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;min-height:3px}
.vb .c i.warn{background:var(--amber)}.vb .c i.off{background:var(--line)}.vb .c i.gray{background:var(--gray)}.vb .c i.w{background:#fff}.vb .c i.wd{background:rgba(255,255,255,.14)}
.vb .c span{font-size:9px;color:var(--mute)}.dark .vb .c span{color:rgba(255,255,255,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mute);background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea,input[type=number],input[type=text]{font:inherit;font-size:14px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.ai{font-size:14px;line-height:1.65;margin:0}
.ai b{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--mute);font-size:10px;font-weight:500}
nav a.on{color:var(--acc);font-weight:700}
.view{display:none;flex-direction:column;gap:14px}.view.on{display:flex}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.strip i{display:block;transform-origin:left;animation:growx .8s ease-out both}
.num{display:flex;align-items:baseline;gap:8px}.num b{font-size:28px;font-weight:700}.num small{font-size:13px;color:var(--mute)}
.dark .num small{color:rgba(255,255,255,.65)}
.hi{color:#FCD34D}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.dash{border:1.5px dashed #C0C5CE;border-radius:10px;padding:12px;font-size:13px;color:var(--gray)}
.legend{display:flex;flex-direction:column;gap:5px;flex:1}
.legend div{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend em{width:8px;height:8px;border-radius:2px;display:inline-block}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.heat span{aspect-ratio:1;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gray)}
.heat span.on{background:var(--acc);color:#fff}.heat span.today{outline:1.5px solid var(--acc)}.heat span.h{background:transparent;color:var(--mute)}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--off)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<div id="app">
  <div id="v-home" class="view"></div>
  <div id="v-money" class="view"></div>
  <div id="v-sport" class="view"></div>
  <div id="v-study" class="view"></div>
  <div id="v-places" class="view"></div>
  <div id="v-challenge" class="view"></div>
</div>
<nav id="nav"></nav>
<div id="toast" class="toast"></div>
<script>
'use strict';
// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = (d) => addDays(d, -((d.getDay()+6)%7));
const WD = ['日','月','火','水','木','金','土'];
const man = (v, dec=1) => (v/10000).toFixed(dec);
const fmtYen = (v) => v >= 10000 ? `${man(v)}万円` : `${Math.round(v).toLocaleString()}円`;
const today = new Date(); const TODAY = ymd(today);
const WEEK0 = ymd(monday(today)); const MONTH0 = TODAY.slice(0,7);
const DAYS = [...Array(7)].map((_,i)=>ymd(addDays(monday(today), i)));
const elapsed = Math.min(7, Math.max(1, (today.getDay()+6)%7 + 1));

function ring(pct, size, stroke, col, track, label, sub, delay=0, fs=22, lc='var(--ink)') {
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-Math.max(0,Math.min(100,pct))/100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"></circle><circle class="v" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" style="--c:${c.toFixed(1)};--off:${off.toFixed(1)};animation-delay:${delay}s"></circle></svg>${label!=null?`<div class="lab"><b style="font-size:${fs}px;color:${lc}">${label}</b>${sub?`<small>${sub}</small>`:''}</div>`:''}</div>`;
}
function donut(parts, size=124, stroke=20) {
  const total = parts.reduce((a,p)=>a+p.v,0)||1, r=(size-stroke)/2, c=2*Math.PI*r; let acc=0, s='';
  parts.forEach((p,i)=>{ const L=c*p.v/total; s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${L.toFixed(1)} ${(c-L).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" style="opacity:0;animation:fadein .4s ease-out ${0.1+i*0.1}s forwards"></circle>`; acc+=L; });
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${s}</svg><style>@keyframes fadein{to{opacity:1}}</style></div>`;
}
function vbars(items, maxv, h=70) {
  return `<div class="vb" style="height:${h+30}px">` + items.map((it,i)=>`<div class="c"><span>${it.top??''}</span><i class="${it.cls||''}" style="height:${it.v?Math.max(3,Math.round(it.v/maxv*h)):3}px;animation-delay:${(0.1+i*0.05).toFixed(2)}s"></i><span>${it.lab}</span></div>`).join('') + '</div>';
}
const bar = (pct, col='var(--acc)') => `<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%;background:${col}"></i></div>`;
const row = (l, r, sub, rc) => `<div class="row"><span>${l}${sub?`<span class="sub">${sub}</span>`:''}</span><b style="${rc?`color:${rc}`:''}">${r}</b></div>`;
const card = (title, inner, tag, tagcls) => `<section class="card"><div class="hd"><h2>${title}</h2>${tag?`<span class="tag ${tagcls||''}">${tag}</span>`:''}</div>${inner}</section>`;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800); }

// ---------- state ----------
const S = {
  config: null, week: null, month: null, hist: null, places: null, insight: null,
  entries: {}, ready: false, dbOk: null, saving: {}
};
const DEFAULT_CONFIG = {
  weeklyFrame: 70000, monthlyCap: 300000, weightTarget: 79.9, weightDue: '2026-12-31',
  englishMin: 60, toeflTarget: 4.5, toeflDue: '2027-01-31', birthday30: '2027-09-29',
  sports: [['pickle','ピックルボール',3],['run','夜ラン',3],['golf','ゴルフ',2],['pilates','ピラティス',1],['rexer','朝のRexer',2]],
  officeBy: '10:00', officeBest: '09:00'
};
const cfg = () => Object.assign({}, DEFAULT_CONFIG, S.config||{});

// ---------- derived ----------
// transactions of the current month: kind 'fixed'|'var', with user overrides and cash entries
function monthTx(){ const m=S.month||{}; const ov=m.overrides||{}; return (m.tx||[]).map(t=>Object.assign({}, t, {kind: ov[t.id]||t.kind})); }
function cashTx(){ const out=[]; Object.entries(S.entries).forEach(([d,e])=>(e.cash||[]).forEach((c,i)=>out.push({id:'cash-'+d+'-'+i, d, a:c.a, m:c.note||'現金', src:'現金', kind:c.kind||'var', cat:c.cat||'現金', cash:true}))); return out; }
function allTx(){ return monthTx().concat(cashTx().filter(t=>t.d.startsWith(MONTH0))); }
function weekSpend(){ const days={}; DAYS.forEach(d=>days[d]=0); let total=0; let fixed=0;
  monthTx().concat(cashTx()).forEach(t=>{ if(!DAYS.includes(t.d)) return; if(t.kind==='fixed'){fixed+=t.a; return;} days[t.d]=(days[t.d]||0)+t.a; total+=t.a; });
  // fallback: week doc days (legacy) when no tx loaded
  if(!(S.month&&S.month.tx)&&S.week&&S.week.days){ Object.entries(S.week.days).forEach(([d,v])=>{days[d]=v; total+=v;}); }
  return {total, days, fixed}; }
function monthSpend(){ const tx=allTx(); let fixed=0, variable=0; const cats={}, fixedList=[], other={};
  tx.forEach(t=>{ if(t.kind==='fixed'){ fixed+=t.a; fixedList.push(t); } else { variable+=t.a; cats[t.cat]=(cats[t.cat]||0)+t.a; if(t.cat==='その他') other[t.m]=(other[t.m]||0)+t.a; } });
  return {fixed, variable, cats:Object.entries(cats).sort((a,b)=>b[1]-a[1]), fixedList:fixedList.sort((a,b)=>b.a-a.a), other:Object.entries(other).sort((a,b)=>b[1]-a[1])}; }
function habits(){ let n=0, pts=0; DAYS.slice(0,elapsed).forEach(d=>{ const e=S.entries[d]||{}; n+=2; if(e.morning) pts++; if(e.bed_ok===true || (e.bed && (e.bed<='00:30'||e.bed>='18:00'))) pts++; }); return {pct: n?pts/n*100:0, pts, n}; }
function weekStudy(){ let tot=0, done=0; DAYS.forEach(d=>{ const m=S.entries[d]?.study_min||0; tot+=m; if(m>=cfg().englishMin) done++; }); return {tot, done}; }
function weekSport(){ const w=S.week||{}; const sp=w.sport||{}; let done=0, goal=0; cfg().sports.forEach(([k,,g])=>{ done+=Math.min(sp[k]||0,g); goal+=g; }); return {done, goal, sp}; }
function latestWeight(){ let best=null; Object.entries(S.entries).forEach(([d,e])=>{ if(e.weight && (!best||d>best.d)) best={d, kg:e.weight}; }); if(!best && S.hist?.weight){ const w=S.hist.weight; best={d:w.at, kg:w.kg}; } return best; }
function score(){
  const c=cfg(); const parts=[];
  const ws=weekSpend(); const frameSoFar = c.weeklyFrame; // weekly frame judged against whole week
  const mScore = ws.total<=frameSoFar ? 100 : Math.max(0, 100 - (ws.total-frameSoFar)/frameSoFar*100);
  parts.push({k:'money', w:30, s:mScore});
  const st=weekStudy(); parts.push({k:'study', w:25, s:Math.min(100, st.tot/(c.englishMin*elapsed)*100)});
  const sp=weekSport(); parts.push({k:'sport', w:20, s:sp.goal? Math.min(100, sp.done/(sp.goal*elapsed/7)*100):0});
  parts.push({k:'habits', w:15, s:habits().pct});
  const wt=latestWeight(); parts.push({k:'weight', w:10, s: wt && DAYS.includes(wt.d) ? 100 : 0});
  const tot=parts.reduce((a,p)=>a+p.w,0); return {total: Math.round(parts.reduce((a,p)=>a+p.s*p.w,0)/tot), parts};
}

// ---------- views ----------
const SPORT_ICON = {
  pickle:'<circle cx="10" cy="9" r="6"/><path d="M14.5 13.5L20 19"/><circle cx="6" cy="19" r="2"/>',
  run:'<circle cx="14" cy="4" r="1.6"/><path d="M6 20l4-6 3 2 2-5-4-2-3 3"/><path d="M13 11l3 2 3-1"/><path d="M11 14l-1 6"/>',
  golf:'<path d="M8 3v18"/><path d="M8 3l9 4-9 4"/><path d="M4 21h9"/>',
  pilates:'<circle cx="12" cy="5" r="1.8"/><path d="M4 14c3-3 13-3 16 0"/><path d="M12 8v6"/><path d="M6 20l6-4 6 4"/>',
  rexer:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>',
  tennis:'<circle cx="10" cy="9" r="6"/><path d="M14.5 13.5L20 19"/><path d="M6 6l8 6M6 12l8-6"/>',
  other:'<circle cx="12" cy="12" r="8"/>'
};
const sportIcon = (k, col='var(--acc)') => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="${k}">${SPORT_ICON[k]||SPORT_ICON.other}</svg>`;
const ICONS = {
  home:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  money:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',
  sport:'<path d="M6 5v14M18 5v14M6 12h12M3 8v8M21 8v8"/>',
  study:'<path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/>',
  places:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  challenge:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>'
};
const TABS = [['home','目標'],['money','お金'],['sport','運動'],['study','学習'],['places','場所'],['challenge','挑戦']];
function renderNav(active){
  $('nav').innerHTML = TABS.map(([k,l])=>`<a href="#${k}" class="${k===active?'on':''}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</a>`).join('');
}
function route(){
  const h=(location.hash||'#home').slice(1); const k=TABS.some(t=>t[0]===h)?h:'home';
  TABS.forEach(([t])=>$('v-'+t).classList.toggle('on', t===k));
  renderNav(k); window.scrollTo(0,0); render(k);
}
function dateLabel(){ return `${today.getMonth()+1}月${today.getDate()}日（${WD[today.getDay()]}）`; }
function weekLabel(){ const a=parse(DAYS[0]), b=parse(DAYS[6]); return `${a.getMonth()+1}/${a.getDate()} 〜 ${b.getMonth()+1}/${b.getDate()}`; }
function status(){ if(S.dbOk===false) return `<div class="card"><p class="ai">${esc(S.err||'データに接続できませんでした。電波のある場所で開き直してください。')}</p><button class="btn ghost sm" id="retry">再読み込み</button></div>`; if(!S.ready) return `<div class="card"><p class="mute">読み込み中…</p></div>`; return ''; }

function render(k){ ({home:renderHome, money:renderMoney, sport:renderSport, study:renderStudy, places:renderPlaces, challenge:renderChallenge})[k](); }

function renderHome(){
  const c=cfg(); const sc=score(); const ws=weekSpend(); const st=weekStudy(); const sp=weekSport(); const wt=latestWeight();
  const dayScore = (d) => { if(d>TODAY) return null; const spend=ws.days[d]||0; const study=S.entries[d]?.study_min||0; let s=0,n=0; s+= spend<=c.weeklyFrame/7?100:Math.max(0,100-(spend-c.weeklyFrame/7)/(c.weeklyFrame/7)*100); n++; s+=Math.min(100,study/c.englishMin*100); n++; return Math.round(s/n); };
  const cal = DAYS.map(d=>{ const dt=parse(d); const s=dayScore(d); const isT=d===TODAY; const dot = isT?'now':(s==null?'':(s>=70?'ok':'warn')); return `<div class="d ${isT?'today':''}"><span>${WD[dt.getDay()]}</span><b>${dt.getDate()}</b><i class="dot ${dot}"></i></div>`; }).join('');

  // goal rings

  html += status();

}
function autoInsight(){
  const c=cfg(); const ws=weekSpend(); const st=weekStudy(); const sp=weekSport(); const over=ws.total-c.weeklyFrame; const parts=[];
  if(over>0) parts.push(`今週は${WD[today.getDay()]}曜までで${man(ws.total)}万円と、週の枠を${man(over)}万円超えています。<b>今日と明日はカードを使わない日</b>にできると流れが変わります。`); else parts.push(`今週の支出は${man(ws.total)}万円で枠内。このペースなら週末に${fmtYen(c.weeklyFrame-ws.total)}残ります。`);
  if(st.tot===0) parts.push(`英語の記録がまだありません。今夜、学習ページから分数を入れるところから始めましょう。`);
  const behind=c.sports.filter(([k,,g])=>(sp.sp[k]||0)<Math.ceil(g*elapsed/7)); if(behind.length) parts.push(`運動は${behind.map(b=>b[1]).slice(0,2).join('・')}が遅れ気味。今夜30分走れば週3ペースに乗れます。`);
  if(S.month?.nextStep) parts.push(S.month.nextStep+'。');
  return parts.join('');
}

  html += card('種目ごとの目標', `<div class="grid5">${c.sports.map(([k,n,g],i)=>{ const d=sp.sp[k]||0; return `<div class="gcell" style="font-size:11px;font-weight:400;text-align:center">${ring(d/g*100,56,6,d>=g?'var(--ok)':(d?'var(--acc)':'var(--amber)'),'var(--line)',`${d}/${g}`,null,0.2+i*0.08,13)}<span style="line-height:1.2">${n}</span><div style="display:flex;gap:4px"><button class="btn ghost sm" data-sport="${k}" data-delta="-1" style="padding:4px 7px" ${d?'':'disabled'}>−</button><button class="btn ghost sm" data-sport="${k}" data-delta="1" style="padding:4px 7px">＋</button></div></div>`; }).join('')}</div><p class="mute" style="margin:0">Rexerは「ピックルのない平日の朝」。+1でその場で記録できます</p>`, '手入力OK');
  const log=w.sportLog||{}; // {date:[labels]}
  html += card('今週のカレンダー', `<div class="cal" style="gap:4px">${DAYS.map(d=>{ const dt=parse(d); const acts=log[d]||[]; return `<div style="display:flex;flex-direction:column;gap:4px"><span class="mute" style="text-align:center;font-size:11px">${WD[dt.getDay()]}<br><b style="color:var(--ink)">${dt.getDate()}</b></span>${acts.length?acts.map(a=>{ const key=SPORT_ICON[a]?a:(c.sports.find(s=>s[1]===a)?.[0]||(a==='テニス'?'tennis':'other')); return `<span style="display:flex;justify-content:center;padding:4px 0;background:var(--soft);border-radius:8px">${sportIcon(key)}</span>`; }).join(''):`<span class="mute" style="text-align:center;color:#C0C5CE">—</span>`}</div>`; }).join('')}</div><div class="chips" style="gap:10px">${c.sports.map(([k,n])=>`<span class="mute" style="display:flex;align-items:center;gap:4px">${sportIcon(k,'var(--mute)')}${n}</span>`).join('')}<span class="mute" style="display:flex;align-items:center;gap:4px">${sportIcon('tennis','var(--mute)')}テニス</span></div>`);
  html += card('朝のルーティン', `<div style="display:flex;justify-content:space-around">${DAYS.slice(0,5).map(d=>{ const dt=parse(d); const m=S.entries[d]?.morning; const isT=d===TODAY; return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="mute">${WD[dt.getDay()]}</span><button class="chip ${m?'on':''}" data-morning="${d}" style="width:34px;height:34px;border-radius:17px;padding:0;font-size:${m?'14px':'10px'}">${m?'✓':(isT?'今日':'')}</button></div>`; }).join('')}</div><p class="mute" style="margin:0">7時起床 → 朝ジムかピックル → 出社。できた日はタップ。前日23時までオフィスにいた翌朝は免除</p>`);
  const bed=S.entries[TODAY]?.bed||'';
  html += card('生活習慣', `<div class="row"><span>就寝 <span class="sub">目標 0:30まで。ヘルスケア連携までは手入力</span></span><b>${bed?esc(bed):'—'}</b></div><div style="display:flex;gap:8px"><input type="text" id="in-bed" placeholder="昨夜の就寝時刻（例 00:45）" value="${esc(bed)}"><button class="btn sm" id="save-bed">記録</button></div><div style="display:flex;justify-content:space-around">${DAYS.slice(0,elapsed).map(d=>{ const e=S.entries[d]||{}; const ok=e.bed && (e.bed<='00:30'||e.bed>='18:00'); return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span class="mute">${WD[parse(d).getDay()]}</span><span style="font-size:13px;font-weight:600;color:${e.bed?(ok?'var(--ok)':'var(--amber)'):'var(--gray)'}">${e.bed?esc(e.bed):'·'}</span></div>`; }).join('')}</div>`, `${habits().pts} / ${habits().n}`);
  const wh=(S.hist?.weights||[]).concat(Object.entries(S.entries).filter(([,e])=>e.weight).map(([d,e])=>[d,e.weight])).sort((a,b)=>a[0]<b[0]?-1:1);
  const mx=Math.max(90,...wh.map(x=>x[1]));
  html += card('体重', `<div class="num"><b>${wt?wt.kg:'—'}<span style="font-size:14px;font-weight:500"> kg</span></b><small>目標 ${c.weightTarget}kg（12/31）${wt?`・あと${(wt.kg-c.weightTarget).toFixed(1)}kg`:''}</small></div>${vbars(wh.slice(-6).map(([d,v])=>({lab:d.slice(5).replace('-','/'), v:v-70, top:v})).concat([{lab:'目標',v:c.weightTarget-70,top:c.weightTarget,cls:'gray'}]), mx-70, 60)}<div style="display:flex;gap:8px"><input type="number" step="0.1" id="in-weight" placeholder="今日の体重（kg）"><button class="btn sm" id="save-weight">記録</button></div><p class="mute" style="margin:0">週1回・土曜に測定。食事は1日2,100kcal</p>`, wt?`最新 ${wt.d.slice(5).replace('-','/')}`:'', 'ok');
  html += status();
  $('v-sport').innerHTML=html;
  document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener('click', async()=>{ const k=b.dataset.sport, dl=Number(b.dataset.delta); const sp2=Object.assign({}, (S.week||{}).sport||{}); sp2[k]=Math.max(0,(sp2[k]||0)+dl); const log2=JSON.parse(JSON.stringify((S.week||{}).sportLog||{})); const name=c.sports.find(s=>s[0]===k)[1];
    if(dl>0){ log2[TODAY]=(log2[TODAY]||[]).concat([k]); } else { for(const d of [...DAYS].reverse()){ const i=(log2[d]||[]).lastIndexOf(k); if(i<0&&log2[d]){ const j=log2[d].lastIndexOf(name); if(j>=0){log2[d].splice(j,1); break;} } if(i>=0){ log2[d].splice(i,1); break; } } }
    await saveWeek({sport:sp2, sportLog:log2}); toast(dl>0?`${name} ＋1（間違えたら −）`:`${name} を1回戻しました`); }));
  document.querySelectorAll('[data-morning]').forEach(b=>b.addEventListener('click', async()=>{ const d=b.dataset.morning; await saveEntry(d, {morning: !(S.entries[d]?.morning)}); }));
  $('save-bed')?.addEventListener('click', async()=>{ let v=$('in-bed').value.trim().replace('：',':'); if(/^\d{1,2}:\d{2}$/.test(v)){ v=v.padStart(5,'0'); await saveEntry(TODAY,{bed:v}); toast('就寝時刻を記録しました'); } else toast('00:45 の形で入れてください'); });
  $('save-weight')?.addEventListener('click', async()=>{ const v=Number($('in-weight').value); if(!v||v<40||v>150){toast('体重を確認してください');return;} await saveEntry(TODAY,{weight:v}); toast('体重を記録しました'); });
}

function renderStudy(){
  const c=cfg(); const st=weekStudy(); const tm=S.entries[TODAY]?.study_min||0;
  let html=`<section class="dark"><div class="hd" style="align-items:baseline"><div><p class="mute" style="margin:0;font-size:12px">英語＝仕事に最も効く投資</p><h1>学習</h1></div><span class="mute" style="font-size:11px">${weekLabel()}</span></div><div style="display:flex;align-items:center;gap:16px">${ring(st.tot/(c.englishMin*7)*100,104,10,'var(--acc)','rgba(255,255,255,.12)',st.tot?`${Math.floor(st.tot/60)}h${pad(st.tot%60)}`:'—','今週',0.1,st.tot?24:30,'#fff')}<div style="flex:1;display:flex;flex-direction:column;gap:5px"><span class="mute" style="font-size:13px">英語 毎日${c.englishMin}分</span><span style="font-size:15px;font-weight:600;line-height:1.4">${tm>=c.englishMin?'今日の分は達成。<span class="hi">連続</span>を伸ばしましょう':`今日あと <span class="hi">${c.englishMin-tm}分</span>。帰りの通勤で30分`}</span><span class="mute" style="font-size:11px">達成 ${st.done}日 / ${elapsed}日</span></div></div></section>`;
  const items=DAYS.map(d=>{ const m=S.entries[d]?.study_min||0; return {lab:WD[parse(d).getDay()], v:m, top:m||'', cls:m>=c.englishMin?'':(m?'warn':'off')}; });
  html += card('今週の英語', `<div style="position:relative">${vbars(items, Math.max(90,...items.map(i=>i.v)), 70)}<div style="position:absolute;left:0;right:0;bottom:${Math.round(c.englishMin/Math.max(90,...items.map(i=>i.v))*70)+30}px;border-top:1.5px dashed #9AA1AD"></div></div><p class="mute" style="margin:0">日ごとの学習分数。${c.englishMin}分の線を越えた日が緑</p>`);
  html += card('今日の記録', `<div class="num"><b>${tm}</b><small>分 / ${c.englishMin}分</small></div><div class="chips">${[15,30,45,60].map(n=>`<button class="chip" data-min="${n}">+${n}分</button>`).join('')}<button class="chip" data-min="reset">リセット</button></div><div style="display:flex;gap:8px;align-items:center"><input type="text" id="in-studynote" placeholder="何をやった？（Morning Line・シャドーイング など）" value="${esc(S.entries[TODAY]?.study_note||'')}"><button class="btn sm" id="save-studynote">保存</button></div>`, '手入力');
  html += card('目標スコア', `<div style="display:flex;align-items:center;gap:16px">${ring(0,80,8,'var(--acc)','var(--line)',c.toeflTarget,'目標',0.3,20)}<div style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-weight:600">TOEFL iBT 新形式（1〜6）</span><span class="mute" style="font-size:13px">2027年1月末まで あと${Math.round((parse(c.toeflDue)-today)/864e5)}日。受験日は未定</span><span class="mute" style="font-size:13px">推定スコアはMorning Lineの結果から算出予定</span></div></div>`);
  html += status();
  $('v-study').innerHTML=html;
  document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click', async()=>{ const v=b.dataset.min; const cur=S.entries[TODAY]?.study_min||0; await saveEntry(TODAY,{study_min: v==='reset'?0:cur+Number(v)}); }));
  $('save-studynote')?.addEventListener('click', async()=>{ await saveEntry(TODAY,{study_note:$('in-studynote').value.trim()}); toast('保存しました'); });
}

function autoPlaces(){
  const p=S.places||{}; const w=S.week||{}; const log=w.sportLog||{}; const places=[]; Object.values(log).forEach(a=>a.forEach(x=>places.push(x)));
  const t=p.towns||[]; const parts=[];
  const days=Object.keys(log).filter(d=>DAYS.includes(d)&&log[d].length).map(d=>WD[parse(d).getDay()]);
  if(places.length) parts.push(`今週は${days.join('・')}曜に運動の場所へ（${places.length}回）。`); else parts.push(`今週はまだ運動の場所に行っていません。`);
  parts.push(`今日は${WD[today.getDay()]}曜。${today.getDay()>=4?'週の後半なので、今夜か明日の朝に1か所行けると今週の形が整います。':'夜に家の近くを30分走るだけでも、今週の記録が1つ増えます。'}`);
  parts.push(`「今週いた町」と町ごとの支出は、土曜にタイムラインを取り込むと数日単位でここに出ます。`);
  return parts.join('');
}
function renderPlaces(){
  const p=S.places||{}; const w=S.week||{}; const off=w.office||{};
  let html=`<section class="dark"><div class="hd" style="align-items:baseline"><div><p class="mute" style="margin:0;font-size:12px">出社時刻（10時まで・ベスト9時）</p><h1>場所</h1></div><span class="mute" style="font-size:11px">${weekLabel()}</span></div><div style="display:flex;justify-content:space-around;padding:4px 0">${DAYS.slice(0,5).map(d=>{ const dt=parse(d); const t=off[d]; const isT=d===TODAY; return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span class="mute" style="font-size:11px">${WD[dt.getDay()]} ${dt.getDate()}</span><span style="font-size:16px;font-weight:700;color:${t?(t<='09:00'?'#34D399':(t<='10:00'?'#fff':'#FCD34D')):'rgba(255,255,255,.4)'}">${t||(isT?'今日':'·')}</span></div>`; }).join('')}</div><span class="mute" style="font-size:12px;line-height:1.5">到着時刻は、iPhoneのショートカット「TOKIAに到着したとき」から自動で入ります（設定は次の段階）</span></section>`;
  html += card('目標に関わる場所', (p.venues||[['Rexer 青山','—','場所を登録すれば自動判定'],['ライザップゴルフ 六本木','—',''],['zen place 渋谷','—',''],['ピックルボール（体育館）','—','']]).map(v=>row(esc(v[0]),esc(v[1]),esc(v[2]))).join(''), '取り込み待ち');
  html += card('AIからひとこと（場所）', `<p class="ai">${esc(p.weekNote||'')||autoPlaces()}</p>`);
  if(p.towns){ const mx=p.towns[0][1]; html += card('この1年によくいた町', p.towns.map(([t,n,tag],i)=>`<div style="display:grid;grid-template-columns:16px 76px 1fr 44px;align-items:center;gap:8px"><span class="mute">${i+1}</span><span style="font-size:13px">${esc(t)}${tag?` <span class="mute">${esc(tag)}</span>`:''}</span>${bar(n/mx*100)}<span style="font-size:12px;font-weight:600;text-align:right">${n}回</span></div>`).join('')+`<p class="mute" style="margin:0">${esc(p.townsNote||'')}</p>`, '実データ','ok'); }
  if(p.trips){ html += card(`海外旅行（${p.trips.length}回）`, p.trips.map(([d,t])=>`<div style="display:flex;gap:12px;align-items:baseline"><span class="mute" style="flex:0 0 96px">${esc(d)}</span><span style="font-size:14px">${esc(t)}</span></div>`).join('')+`<p class="mute" style="margin:0">${esc(p.distNote||'')}</p>`, '実データ','ok'); }
  html += status();
  $('v-places').innerHTML=html;
}

function renderChallenge(){
  const c=cfg(); const left=Math.round((parse(c.birthday30)-today)/864e5); const e=S.entries[TODAY]||{};
  const all=Object.entries(S.entries).filter(([,x])=>x.challenge_am||x.challenge_pm).sort((a,b)=>a[0]<b[0]?1:-1);
  const thisMonth=all.filter(([d])=>d.startsWith(MONTH0));
  let html=`<section class="dark"><div class="hd" style="align-items:baseline"><div><p class="mute" style="margin:0;font-size:12px">29歳の残り</p><h1>挑戦</h1></div><span class="mute" style="font-size:11px">${WD[today.getDay()]}曜</span></div><div style="display:flex;align-items:center;gap:16px">${ring(100-left/365*100,104,10,'var(--acc)','rgba(255,255,255,.12)',left,'日',0.1,28,'#fff')}<div style="flex:1;display:flex;flex-direction:column;gap:5px"><span class="mute" style="font-size:13px">30歳（2027/9/29）まで</span><span style="font-size:15px;font-weight:600;line-height:1.4">コンフォートゾーンの外へ。<span class="hi">今日の挑戦</span>を朝に決めて、夜に振り返る</span><span class="mute" style="font-size:11px">記録 ${all.length}件・今月 ${thisMonth.length}件</span></div></div></section>`;
  const moods=['緊張した','やりきった','次はもっと','逃げた','意外と平気'];
  html += card('今日の挑戦', `<div style="display:flex;gap:10px;align-items:flex-start"><span class="tag warn">朝</span><div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="mute">今日はどんな挑戦をする？</span><textarea id="in-am" placeholder="例：会議で最初に発言する／英語で雑談を振る／初めての場所に一人で行く">${esc(e.challenge_am||'')}</textarea></div></div><div class="hr"></div><div style="display:flex;gap:10px;align-items:flex-start"><span class="tag blue">夜</span><div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="mute">できた？ そのときの気持ちは？</span><div class="chips" id="moods">${moods.map(m=>`<button class="chip ${e.mood===m?'on':''}" data-mood="${m}">${m}</button>`).join('')}</div><textarea id="in-pm" placeholder="一言メモ（22:00にリマインド）">${esc(e.challenge_pm||'')}</textarea></div></div><button class="btn" id="save-ch">記録する</button>`);
  const first=parse(MONTH0+'-01'); const lead=(first.getDay()+6)%7; const dim=new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const set=new Set(thisMonth.map(([d])=>parseInt(d.slice(8))));
  html += card(`${parseInt(MONTH0.slice(5))}月`, `<div class="heat">${'月火水木金土日'.split('').map(d=>`<span class="h">${d}</span>`).join('')}${[...Array(lead)].map(()=>'<span style="background:transparent"></span>').join('')}${[...Array(dim)].map((_,i)=>{ const n=i+1; const d=`${MONTH0}-${pad(n)}`; return `<span class="${set.has(n)?'on':''} ${d===TODAY?'today':''}">${n}</span>`; }).join('')}</div><p class="mute" style="margin:0">挑戦した日が色づいていきます。毎週土曜と月末に、ここを一緒に振り返ります</p>`);
  if(all.length) html += card('これまでの挑戦', all.slice(0,30).map(([d,x])=>`<div style="display:flex;flex-direction:column;gap:3px"><div class="row"><span class="mute">${d.slice(5).replace('-','/')}（${WD[parse(d).getDay()]}）</span>${x.mood?`<span class="tag">${esc(x.mood)}</span>`:''}</div>${x.challenge_am?`<p class="ai" style="margin:0"><span class="tag warn" style="margin-right:6px">朝</span>${esc(x.challenge_am)}</p>`:''}${x.challenge_pm?`<p class="ai" style="margin:0"><span class="tag blue" style="margin-right:6px">夜</span>${esc(x.challenge_pm)}</p>`:''}</div><div class="hr"></div>`).join(''));
  html += status();
  $('v-challenge').innerHTML=html;
  let mood=e.mood||'';
  document.querySelectorAll('[data-mood]').forEach(b=>b.addEventListener('click',()=>{ mood=b.dataset.mood===mood?'':b.dataset.mood; document.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('on',x.dataset.mood===mood)); }));
  $('save-ch')?.addEventListener('click', async()=>{ await saveEntry(TODAY,{challenge_am:$('in-am').value.trim(), challenge_pm:$('in-pm').value.trim(), mood}); toast('記録しました'); });
}

// ---------- persistence (Supabase edge function) ----------
const BASE = 'https://ywfarznprmzufzpkgjgb.supabase.co/functions/v1/app';
let PIN = ''; try{ PIN = localStorage.getItem('ll_pin')||''; }catch(e){}
async function api(path, opts={}){
  const r = await fetch(BASE+path, Object.assign({headers:{'x-app-pin':PIN,'content-type':'application/json'}}, opts));
  if(r.status===401){ const e=new Error('pin'); e.pin=true; throw e; }
  if(!r.ok){ throw new Error('HTTP '+r.status+' '+(await r.text().catch(()=>''))); }
  return r.json();
}
function showPin(msg){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  let v=$('v-pin'); if(!v){ v=document.createElement('div'); v.id='v-pin'; v.className='view'; $('app').appendChild(v); }
  v.classList.add('on');
  v.innerHTML=`<section class="dark" style="margin-top:40px"><h1>行動ログ</h1><p class="mute" style="margin:0;font-size:13px">${esc(msg||'暗証番号を入れてください（この端末では次回から不要です）')}</p></section><section class="card"><input type="password" inputmode="numeric" id="in-pin" placeholder="暗証番号" autocomplete="off"><button class="btn" id="go-pin">開く</button></section>`;
  const go=async()=>{ PIN=$('in-pin').value.trim(); try{ localStorage.setItem('ll_pin',PIN); }catch(e){} v.classList.remove('on'); S.ready=false; S.dbOk=null; route(); await load(); };
  $('go-pin').addEventListener('click',go); $('in-pin').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
async function put(path, data){
  try{ await api('/api/doc',{method:'POST',body:JSON.stringify({path,data})}); }
  catch(e){ if(e.pin){ showPin('暗証番号が違うか、期限切れです'); } else { toast('保存に失敗しました'); console.error(e); } }
}
async function saveEntry(d, patch){ const cur=Object.assign({}, S.entries[d]||{}, patch); S.entries[d]=cur; rerender(); await put('entries/'+d, cur); }
async function saveWeek(patch){ const cur=Object.assign({}, S.week||{}, patch); S.week=cur; rerender(); await put('weeks/'+WEEK0, cur); }
async function saveMonth(patch, msg){ const cur=Object.assign({}, S.month||{}, patch); S.month=cur; rerender(); toast(msg||'保存しました'); await put('months/'+MONTH0, cur); }
function rerender(){ const h=(location.hash||'#home').slice(1); render(TABS.some(t=>t[0]===h)?h:'home'); document.getElementById('retry')?.addEventListener('click',()=>{ S.ready=false; S.dbOk=null; rerender(); load(); }); }
async function load(){
  try{
    const docs = await api('/api/docs');
    const by={}; docs.forEach(d=>{ by[d.path]=d.data; });
    S.config=by['app/config']||null; S.week=by['weeks/'+WEEK0]||null; S.month=by['months/'+MONTH0]||null;
    S.hist=by['history/money']||null; S.places=by['history/places']||null; S.insight=by['insights/latest']||null;
    const ent={}; Object.keys(by).forEach(p=>{ if(p.startsWith('entries/')) ent[p.slice(8)]=by[p]; }); S.entries=ent;
    S.dbOk=true; S.ready=true; rerender();
  }catch(e){
    if(e.pin){ showPin(PIN?'暗証番号が違います':undefined); return; }
    S.dbOk=false; S.ready=true; S.err=String(e.message||e); rerender();
  }
}
function boot(){ renderNav('home'); route(); window.addEventListener('hashchange', route); load(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.dbOk) load(); }); }
boot();
